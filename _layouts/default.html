<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f5f7f3; --surface:#ffffff; --ink:#1b2420; --muted:#5d6a63; --line:#d9e0da;
  --green:#2e6a4c; --green-soft:#e3efe7; --gold:#a8710a; --gold-soft:#f8eed6;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Literata",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111613; --surface:#18201b; --ink:#e7ede8; --muted:#9aa8a0; --line:#2b3530;
  --green:#7cc29b; --green-soft:#1d2f25; --gold:#e3b04b; --gold-soft:#2e2615; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 var(--body);
  padding:0 max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left))}
.top{max-width:820px;margin:0 auto;padding:18px 0 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top a{font-family:var(--display);font-weight:700;color:var(--green);text-decoration:none;font-size:1rem}
.top span{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
main{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3rem);margin:28px 0 12px;letter-spacing:-.01em}
h2{font-size:1.55rem;margin:44px 0 12px;padding-top:18px;border-top:2px solid var(--green)}
h3{font-size:1.15rem;margin:28px 0 8px;color:var(--green)}
p,ul,ol{margin:0 0 14px;max-width:68ch}
ul,ol{padding-left:1.3em}
li{margin:3px 0}
li::marker{color:var(--green)}
strong{font-weight:600}
a{color:var(--green)}
hr{border:0;margin:8px 0}
table{display:block;overflow-x:auto;border-collapse:collapse;margin:8px 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:.95rem;max-width:100%}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--green-soft)}
tr:last-child td{border-bottom:0}
td:first-child{font-family:var(--display);font-weight:600;white-space:nowrap}
code{font-family:var(--mono);font-size:.9em;background:var(--green-soft);padding:1px 5px;border-radius:4px}
blockquote{margin:0 0 16px;padding:12px 16px;background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:0 8px 8px 0}
footer{max-width:820px;margin:48px auto 0;color:var(--muted);font-size:.85rem;font-family:var(--mono)}
</style>
</head>
<body>
<div class="top"><a href="{{ site.baseurl }}/">Meal plans</a><span>cook once · combine all week</span></div>
<main>
{{ content }}
</main>
<footer>Prices are what the shops listed on the plan's date and change often.</footer>
</body>
</html>
